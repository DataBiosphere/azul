<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="620" viewBox="0 0 1530 620" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 600; fill: #222; }
      .pipeline { font-size: 15px; font-weight: 600; fill: #222; }
      .stage { font-size: 11px; fill: #666; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.5px; }
      .job { fill: #fff; stroke: #333; stroke-width: 1.3; }
      .manual { fill: #fff; stroke: #333; stroke-width: 1.3; stroke-dasharray: 5 3; }
      .noop { fill: #f2f2f2; stroke: #aaa; stroke-width: 1.3; }
      .name { font-family: Menlo, Monaco, monospace; font-size: 12px; fill: #111; text-anchor: middle; }
      .name-noop { font-family: Menlo, Monaco, monospace; font-size: 12px; fill: #888; text-anchor: middle; }
      .note { font-size: 10px; fill: #555; text-anchor: middle; font-style: italic; }
      .absent { font-size: 11px; fill: #bbb; text-anchor: middle; font-style: italic; }
      .seq { stroke: #999; stroke-width: 1.2; fill: none; }
      .dep { stroke: #555; stroke-width: 1.3; fill: none; }
      .badge { fill: #e8a33d; stroke: #fff; stroke-width: 1.5; }
      .badge-text { font-size: 9px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .legend { font-size: 12px; fill: #333; }
      .sep { stroke: #ddd; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1530" height="620" fill="#fff"/>
  <text x="20" y="30" class="title">GitLab pipelines for blue-green deployments (proposed)</text>

  <!-- ================= anvilprod pipeline (alias) ================= -->
  <text x="20" y="70" class="pipeline">anvilprod pipeline (alias)</text>
  <g>
    <text x="85" y="95" class="stage">build_image</text>
    <text x="235" y="95" class="stage">setup</text>
    <text x="385" y="95" class="stage">test</text>
    <text x="535" y="95" class="stage">deploy</text>
    <text x="685" y="95" class="stage">early_reindex</text>
    <text x="835" y="95" class="stage">integration_test</text>
    <text x="985" y="95" class="stage">deploy_browser</text>
    <text x="1135" y="95" class="stage">teardown</text>
    <text x="1285" y="95" class="stage">reindex</text>
    <text x="1435" y="95" class="stage">state</text>
  </g>

  <path class="seq" d="M150,132 H170"/>
  <path class="seq" d="M300,132 H320"/>
  <path class="seq" d="M450,132 H470"/>
  <path class="seq" d="M600,132 H770"/>
  <path class="seq" d="M900,132 H920"/>
  <path class="seq" d="M1050,132 H1070"/>
  <path class="seq" d="M1200,132 H1370"/>

  <rect class="job" x="20" y="110" width="130" height="44" rx="6"/>
  <text class="name" x="85" y="136">build_image</text>
  <rect class="job" x="170" y="110" width="130" height="44" rx="6"/>
  <text class="name" x="235" y="136">setup</text>
  <rect class="noop" x="320" y="110" width="130" height="44" rx="6"/>
  <text class="name-noop" x="385" y="128">test</text>
  <text class="note" x="385" y="145">tested in instance pipeline</text>

  <rect class="job" x="470" y="110" width="130" height="44" rx="6"/>
  <text class="name" x="535" y="136">deploy_base</text>
  <path class="dep" d="M535,154 V168" marker-end="url(#arrow)"/>
  <rect class="job" x="470" y="170" width="130" height="44" rx="6"/>
  <text class="name" x="535" y="188">deploy</text>
  <text class="note" x="535" y="205">alias mode: public names</text>

  <text class="absent" x="685" y="152">excluded</text>

  <rect class="noop" x="770" y="110" width="130" height="44" rx="6"/>
  <text class="name-noop" x="835" y="128">integration_test</text>
  <text class="note" x="835" y="145">short-circuits</text>

  <rect class="noop" x="920" y="110" width="130" height="44" rx="6"/>
  <text class="name-noop" x="985" y="128">deploy_browser</text>
  <text class="note" x="985" y="145">short-circuits</text>

  <rect class="job" x="1070" y="110" width="130" height="44" rx="6"/>
  <text class="name" x="1135" y="136">on_success</text>
  <rect class="job" x="1070" y="170" width="130" height="44" rx="6"/>
  <text class="name" x="1135" y="196">on_failure</text>

  <text class="absent" x="1285" y="152">excluded</text>

  <rect class="manual" x="1370" y="110" width="130" height="44" rx="6"/>
  <text class="name" x="1435" y="128">▶ wake</text>
  <text class="note" x="1435" y="145">other instance → standby</text>
  <circle class="badge" cx="1500" cy="110" r="8"/>
  <text class="badge-text" x="1500" y="113">R</text>
  <rect class="manual" x="1370" y="170" width="130" height="44" rx="6"/>
  <text class="name" x="1435" y="188">▶ switch</text>
  <text class="note" x="1435" y="205">other instance → live</text>
  <circle class="badge" cx="1500" cy="170" r="8"/>
  <text class="badge-text" x="1500" y="173">R</text>
  <rect class="manual" x="1370" y="230" width="130" height="44" rx="6"/>
  <text class="name" x="1435" y="248">▶ rest</text>
  <text class="note" x="1435" y="265">other instance → dormant</text>
  <circle class="badge" cx="1500" cy="230" r="8"/>
  <text class="badge-text" x="1500" y="233">R</text>

  <line class="sep" x1="20" y1="300" x2="1510" y2="300"/>

  <!-- ================= instance pipeline ================= -->
  <text x="20" y="330" class="pipeline">anvilprod1 / anvilprod2 pipeline (instance)</text>
  <g>
    <text x="85" y="355" class="stage">build_image</text>
    <text x="235" y="355" class="stage">setup</text>
    <text x="385" y="355" class="stage">test</text>
    <text x="535" y="355" class="stage">deploy</text>
    <text x="685" y="355" class="stage">early_reindex</text>
    <text x="835" y="355" class="stage">integration_test</text>
    <text x="985" y="355" class="stage">deploy_browser</text>
    <text x="1135" y="355" class="stage">teardown</text>
    <text x="1285" y="355" class="stage">reindex</text>
    <text x="1435" y="355" class="stage">state</text>
  </g>

  <path class="seq" d="M150,392 H170"/>
  <path class="seq" d="M300,392 H320"/>
  <path class="seq" d="M450,392 H470"/>
  <path class="seq" d="M600,392 H620"/>
  <path class="seq" d="M750,392 H770"/>
  <path class="seq" d="M900,392 H920"/>
  <path class="seq" d="M1050,392 H1070"/>
  <path class="seq" d="M1200,392 H1220"/>

  <rect class="job" x="20" y="370" width="130" height="44" rx="6"/>
  <text class="name" x="85" y="396">build_image</text>
  <rect class="job" x="170" y="370" width="130" height="44" rx="6"/>
  <text class="name" x="235" y="396">setup</text>
  <rect class="job" x="320" y="370" width="130" height="44" rx="6"/>
  <text class="name" x="385" y="396">test</text>

  <rect class="job" x="470" y="370" width="130" height="44" rx="6"/>
  <text class="name" x="535" y="396">deploy_base</text>
  <path class="dep" d="M535,414 V428" marker-end="url(#arrow)"/>
  <rect class="job" x="470" y="430" width="130" height="44" rx="6"/>
  <text class="name" x="535" y="448">deploy</text>
  <text class="note" x="535" y="465">no OpenSearch if dormant</text>

  <rect class="manual" x="620" y="370" width="130" height="44" rx="6"/>
  <text class="name" x="685" y="388">▶ early_reindex</text>
  <text class="note" x="685" y="405">no-op if dormant</text>

  <rect class="job" x="770" y="370" width="130" height="44" rx="6"/>
  <text class="name" x="835" y="388">integration_test</text>
  <text class="note" x="835" y="405">no-op if dormant</text>

  <rect class="job" x="920" y="370" width="130" height="44" rx="6"/>
  <text class="name" x="985" y="388">deploy_browser</text>
  <text class="note" x="985" y="405">anvilprod.browser</text>

  <rect class="job" x="1070" y="370" width="130" height="44" rx="6"/>
  <text class="name" x="1135" y="396">on_success</text>
  <rect class="job" x="1070" y="430" width="130" height="44" rx="6"/>
  <text class="name" x="1135" y="456">on_failure</text>

  <rect class="manual" x="1220" y="370" width="130" height="44" rx="6"/>
  <text class="name" x="1285" y="388">▶ reindex</text>
  <text class="note" x="1285" y="405">no-op if dormant</text>

  <text class="absent" x="1435" y="396">excluded</text>

  <line class="sep" x1="20" y1="500" x2="1510" y2="500"/>

  <!-- ================= legend ================= -->
  <rect class="job" x="20" y="520" width="70" height="26" rx="5"/>
  <text class="legend" x="100" y="538">automatic</text>
  <rect class="manual" x="190" y="520" width="70" height="26" rx="5"/>
  <text class="legend" x="270" y="538">manual (▶)</text>
  <rect class="noop" x="370" y="520" width="70" height="26" rx="5"/>
  <text class="legend" x="450" y="538">runs, but short-circuits</text>
  <circle class="badge" cx="620" cy="533" r="8"/>
  <text class="badge-text" x="620" y="536">R</text>
  <text class="legend" x="635" y="538">resource_group: anvilprod</text>
  <path class="dep" d="M820,533 H860" marker-end="url(#arrow)"/>
  <text class="legend" x="868" y="538">needs:</text>
  <path class="seq" d="M940,533 H980"/>
  <text class="legend" x="988" y="538">stage order</text>
  <text class="legend" x="20" y="580" fill="#777">"excluded" = job removed from that pipeline by rules: on $CI_COMMIT_BRANCH. The deploy_browser and state stages are new.</text>
</svg>
