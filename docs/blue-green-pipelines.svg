<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="440" viewBox="0 0 1530 440" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 600; fill: #222; }
      .stage { font-size: 11px; fill: #666; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.5px; }
      .job { fill: #fff; stroke: #333; stroke-width: 1.3; }
      .alias { fill: #eef4fb; stroke: #1f75cb; stroke-width: 1.3; }
      .manual { fill: #fff; stroke: #333; stroke-width: 1.3; stroke-dasharray: 5 3; }
      .name { font-family: Menlo, Monaco, monospace; font-size: 12px; fill: #111; text-anchor: middle; }
      .note { font-size: 10px; fill: #555; text-anchor: middle; font-style: italic; }
      .seq { stroke: #999; stroke-width: 1.2; fill: none; }
      .dep { stroke: #555; stroke-width: 1.3; fill: none; }
      .badge { fill: #e8a33d; stroke: #fff; stroke-width: 1.5; }
      .badge-text { font-size: 9px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .legend { font-size: 12px; fill: #333; }
      .sep { stroke: #ddd; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1530" height="440" fill="#fff"/>
  <text x="20" y="30" class="title">GitLab pipeline of an instance (anvilprod1 or anvilprod2), proposed</text>

  <g>
    <text x="85" y="70" class="stage">build_image</text>
    <text x="235" y="70" class="stage">setup</text>
    <text x="385" y="70" class="stage">test</text>
    <text x="535" y="70" class="stage">deploy</text>
    <text x="685" y="70" class="stage">early_reindex</text>
    <text x="835" y="70" class="stage">integration_test</text>
    <text x="985" y="70" class="stage">deploy_browser</text>
    <text x="1135" y="70" class="stage">teardown</text>
    <text x="1285" y="70" class="stage">reindex</text>
    <text x="1435" y="70" class="stage">state</text>
  </g>

  <path class="seq" d="M150,107 H170"/>
  <path class="seq" d="M300,107 H320"/>
  <path class="seq" d="M450,107 H470"/>
  <path class="seq" d="M600,107 H620"/>
  <path class="seq" d="M750,107 H770"/>
  <path class="seq" d="M900,107 H920"/>
  <path class="seq" d="M1050,107 H1070"/>
  <path class="seq" d="M1200,107 H1220"/>
  <path class="seq" d="M1350,107 H1370"/>

  <rect class="job" x="20" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="85" y="111">build_image</text>
  <rect class="job" x="170" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="235" y="111">setup</text>
  <rect class="job" x="320" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="385" y="111">test</text>

  <rect class="alias" x="470" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="535" y="103">deploy_alias_base</text>
  <text class="note" x="535" y="120">anvilprod.base</text>
  <path class="dep" d="M535,129 V143" marker-end="url(#arrow)"/>
  <rect class="alias" x="470" y="145" width="130" height="44" rx="6"/>
  <text class="name" x="535" y="163">deploy_alias</text>
  <text class="note" x="535" y="180">anvilprod</text>
  <path class="dep" d="M535,189 V203" marker-end="url(#arrow)"/>
  <rect class="job" x="470" y="205" width="130" height="44" rx="6"/>
  <text class="name" x="535" y="223">deploy_base</text>
  <text class="note" x="535" y="240">anvilprodN.base</text>
  <path class="dep" d="M535,249 V263" marker-end="url(#arrow)"/>
  <rect class="job" x="470" y="265" width="130" height="44" rx="6"/>
  <text class="name" x="535" y="283">deploy</text>
  <text class="note" x="535" y="300">anvilprodN, wakes it</text>

  <rect class="manual" x="620" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="685" y="111">✋ early_reindex</text>

  <rect class="job" x="770" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="835" y="103">integration_test</text>
  <text class="note" x="835" y="120">canonical names</text>

  <rect class="alias" x="920" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="985" y="103">deploy_browser</text>
  <text class="note" x="985" y="120">anvilprod.browser</text>

  <rect class="job" x="1070" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="1135" y="111">on_success</text>
  <rect class="job" x="1070" y="145" width="130" height="44" rx="6"/>
  <text class="name" x="1135" y="171">on_failure</text>

  <rect class="manual" x="1220" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="1285" y="111">✋ reindex</text>

  <rect class="manual" x="1370" y="85" width="130" height="44" rx="6"/>
  <text class="name" x="1435" y="103">✋ go_live</text>
  <text class="note" x="1435" y="120">this instance → live</text>
  <circle class="badge" cx="1500" cy="85" r="8"/>
  <text class="badge-text" x="1500" y="88">R</text>
  <rect class="manual" x="1370" y="145" width="130" height="44" rx="6"/>
  <text class="name" x="1435" y="163">✋ rest</text>
  <text class="note" x="1435" y="180">this instance → resting</text>
  <circle class="badge" cx="1500" cy="145" r="8"/>
  <text class="badge-text" x="1500" y="148">R</text>

  <line class="sep" x1="20" y1="340" x2="1510" y2="340"/>

  <rect class="job" x="20" y="360" width="70" height="26" rx="5"/>
  <text class="legend" x="100" y="378">automatic, instance</text>
  <rect class="alias" x="240" y="360" width="70" height="26" rx="5"/>
  <text class="legend" x="320" y="378">automatic, alias</text>
  <rect class="manual" x="450" y="360" width="70" height="26" rx="5"/>
  <text class="legend" x="530" y="378">manual (✋)</text>
  <circle class="badge" cx="640" cy="373" r="8"/>
  <text class="badge-text" x="640" y="376">R</text>
  <text class="legend" x="655" y="378">resource_group: anvilprod</text>
  <path class="dep" d="M840,373 H880" marker-end="url(#arrow)"/>
  <text class="legend" x="888" y="378">needs:</text>
  <path class="seq" d="M960,373 H1000"/>
  <text class="legend" x="1008" y="378">stage order</text>
  <text class="legend" x="20" y="420" fill="#777">N is the instance named by the branch being built. The deploy_browser and state stages are new.</text>
</svg>
