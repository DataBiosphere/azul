name: 'CI'

on:
  pull_request:
  push:
    branches: [ 'develop', 'prod', 'anvilprod' ]

jobs:

  test:
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 45
    permissions:
      contents: 'read'
      packages: 'write'
    steps:

      - uses: 'actions/checkout@v4'

      - run: 'cat environment.boot >> "$GITHUB_ENV"'

      - uses: 'actions/setup-python@v5'
        with:
          python-version: '${{ env.azul_python_version }}'

      # The action is referenced by commit, not by tag, because the project
      # doesn't publish a tag for the major version this commit belongs to.
      #
      - uses: 'astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d'  # v10.0.1
        # The action reads `required-version` from `pyproject.toml`.
        with:
          enable-cache: true
          # Key the cache on the lock file. This is more reliable than
          # the default (pyproject.toml), and insensitive to pyproject.toml
          # changes that don't affect the set of dependencies.
          cache-dependency-glob: 'uv.lock'
          # Remove pre-built wheels from the cache before saving, leaving only
          # wheels built during install. The former are cheaper to download
          # again than to restore from the cache.
          prune-cache: true

      - name: 'Run unit tests and other checks'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Everything that determines the contents of the image built from the
          # Dockerfile. The image is reused only by a build whose inputs hash to
          # the same value.
          #
          azul_image_input_hash: "${{ hashFiles(
            'Dockerfile',
            '.dockerignore',
            'environment.boot',
            'pyproject.toml',
            'uv.lock',
            'Makefile',
            'common.mk',
            'bin/keys/*',
            'bin/checksums/*'
          ) }}"
        run: |
          source environment  # load global defaults

          # PRs targetting the `prod` branch should be built with the `prod`
          # deployment selected. The same goes for push builds of the `prod`
          # branch. Likewise for `anvilprod`. All other PR and push builds
          # should select the `dev` deployment. Note that this includes chained
          # PRs whose target branch is not a protected branch but another PR
          # branch.
          #
          azul_shared_deployments='{"": ["dev"], "prod": ["prod"], "anvilprod": ["anvilprod"]}'

          make virtualenv
          source .venv/bin/activate
          make requirements
          deployment=$(python scripts/check_branch.py --print)
          _link $deployment
          _refresh

          make environment.boot

          # FIXME: The default Azul registry is hosted privately on ECR, so we'd
          #        have to provide credentials to use it. For now, it's
          #        sufficient to pull 3rd party images directly from their
          #        upstream registry, accepting the risk that a 3rd party image
          #        is compromised. GitHub Actions have limited access to our
          #        infrastructure (the token scope is limited). The worst that
          #        could happen is that the token itself is revealed or that the
          #        action falsely reports a passing build.
          #        https://github.com/DataBiosphere/azul/issues/5188
          #
          export azul_docker_registry=""

          # The digest in `azul_python_image_mirrored` is that of the image
          # mirror, and digests of multi-platform images differ between the
          # mirror and the upstream registry. With the mirror disabled above,
          # the base image of the image built below must be referred to by its
          # upstream digest.
          #
          export azul_python_image=$azul_python_image_upstream

          # We need the development image because it includes the PyCharm
          # formatter. That's currently the only use of that image on GitHub
          # Actions. Building it dominates the time spent on formatting so we
          # try to reuse an image from a previous run whose inputs were the
          # same.
          #
          # This requires pushing the image after building it. Two builds can
          # race to push to the same tag, but since their inputs hash the same,
          # the images should only differ due to ambient conditions, such as
          # which specific package versions apt-get installs, so either image is
          # as usable as the other.
          #
          export azul_image=ghcr.io/${GITHUB_REPOSITORY,,}/dev
          export azul_image_tag=${{ runner.arch }}-$azul_image_input_hash
          printenv GITHUB_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if docker pull --quiet $azul_image:$azul_image_tag ; then
              echo "Reusing $azul_image:$azul_image_tag"
          else
              make docker_image
              # A build for a PR from a fork's token can't write packages so we
              # skip the push rather than failing the build.
              if [[ '${{ github.event.pull_request.head.repo.fork }}' != 'true' ]] ; then
                  docker push --quiet $azul_image:$azul_image_tag
              fi
          fi

          make _format
          make isort
          make -C lambdas openapi
          make -C .github
          make anvil_schema
          make check_clean
          make pep8
          mypy
          AZUL_DEBUG=0 GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} make test
          make check_clean
          coverage xml

      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'coverage-file'
          path: 'coverage.xml'

  # Nothing in the registry expires automatically, so we need to prune it
  # explicitly. The registry hosts the development image, and a new image is
  # pushed whenever the image inputs change. Pruning an image prematurely only
  # costs a redundant image build, never correctness.
  #
  prune:
    needs: 'test'
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      packages: 'write'
    steps:
      - uses: 'actions/delete-package-versions@v5'
        with:
          package-name: 'azul/dev'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

  codecov:
    needs: 'test'
    runs-on: 'ubuntu-22.04'
    steps:

      - uses: 'actions/checkout@v4'

      - run: 'cat environment.boot >> "$GITHUB_ENV"'

      - uses: 'actions/download-artifact@v4'
        with:
          name: 'coverage-file'

      - uses: 'codecov/codecov-action@v7'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: 'coverage.xml'
          fail_ci_if_error: true

  coveralls:
    needs: 'test'
    runs-on: 'ubuntu-22.04'
    steps:
      - uses: 'actions/checkout@v4'

      - run: 'cat environment.boot >> "$GITHUB_ENV"'

      - uses: 'actions/download-artifact@v4'
        with:
          name: 'coverage-file'

      - uses: 'coverallsapp/github-action@v2'
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}

  codeql:
    runs-on: 'ubuntu-22.04'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]
    steps:

      - uses: 'actions/checkout@v4'

      - run: 'cat environment.boot >> "$GITHUB_ENV"'

      - uses: 'github/codeql-action/init@v3'
        with:
          languages: '${{ matrix.language }}'
          config-file: './.github/codeql/codeql-config.yml'
          queries: 'security-and-quality'

      - uses: 'github/codeql-action/analyze@v3'
        with:
          category: '/language:${{matrix.language}}'
